plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    withJavadocJar()
    withSourcesJar()
}

compileJava {
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    // The release flag is required for Java 9+.
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = 17
    }
}

compileTestJava {
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    // The release flag is required for Java 9+.
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = 17
    }
}